<!-- Account Modal -->
<div class="modal" id="accountModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">添加账号</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form id="accountForm" onsubmit="saveAccount(event)">
      <input type="hidden" id="accountId" />
      <div class="form-group">
        <label class="form-label">账号类型</label>
        <input type="hidden" id="accountType" value="warp" />
        <input class="form-input" id="accountTypeDisplay" value="Warp" readonly />
      </div>
      <div class="form-group" id="credentialModeGroup" hidden>
        <label class="form-label">凭据模式</label>
        <select class="form-input" id="credentialType">
          <option value="sso">SSO Cookie</option>
          <option value="oauth">Build CLI OAuth</option>
        </select>
        <small class="helper-text">Build CLI OAuth 走 cli-chat-proxy.grok.com（grok-build-0.1 等）</small>
      </div>
       <div class="form-group" id="ssoCredentialGroup">
         <label class="form-label" id="tokenLabel">__session</label>
         <textarea class="form-input account-token-input" id="clientCookie" rows="8" wrap="off" spellcheck="false" required placeholder="每行一个 __session"></textarea>
         <small id="tokenHint" class="helper-text">按账号类型填写对应凭证</small>
       </div>
       <div class="form-group" id="warpDeviceLoginGroup" hidden>
         <label class="form-label">官方 Warp 登录</label>
         <button class="btn btn-secondary" id="warpDeviceLoginButton" type="button" onclick="startWarpDeviceLogin()">使用 Warp 官方网页登录</button>
         <small class="helper-text">浏览器将在 app.warp.dev 完成授权；本服务不会读取本地 Warp 文件或接收密码。</small>
         <div class="account-import-status" id="warpDeviceLoginStatus" hidden></div>
       </div>
       <div class="form-group" id="oauthCredentialGroup" hidden>
        <label class="form-label">OAuth Access Token</label>
        <input class="form-input" id="oauthAccessToken" type="text" spellcheck="false" placeholder="access_token" />
      </div>
      <div class="form-group" id="oauthRefreshGroup" hidden>
        <label class="form-label">OAuth Refresh Token</label>
        <input class="form-input" id="oauthRefreshToken" type="text" spellcheck="false" placeholder="refresh_token" />
      </div>
      <div class="form-group" id="oauthExpiresGroup" hidden>
        <label class="form-label">过期时间（可选，RFC3339）</label>
        <input class="form-input" id="oauthExpiresAt" type="text" spellcheck="false" placeholder="2026-08-21T00:00:00Z" />
      </div>
      <div class="form-group">
        <label class="form-label">
          <label class="toggle">
            <input type="checkbox" id="enabled" checked />
            <span class="toggle-slider"></span>
          </label>
          &nbsp;&nbsp;启用账号
        </label>
      </div>
      <div class="account-import-status" id="accountImportStatus" hidden></div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px">
        保存
      </button>
    </form>
  </div>
</div>
